# Single-server production stack with automatic HTTPS.
# Managed by deploy/install.sh — values come from deploy/.env.prod.
x-app-env: &app-env
  DATABASE_URL: postgresql://journey:${POSTGRES_PASSWORD}@postgres:5432/journey
  REDIS_URL: redis://redis:6379
  ENCRYPTION_KEY: ${ENCRYPTION_KEY}
  STORAGE_DRIVER: local
  STORAGE_LOCAL_DIR: /data/artifacts
  # Only the bundled test proxy may live on the private network. The demo shop is
  # reached through its public HTTPS address, like any real website.
  PRIVATE_HOST_ALLOWLIST: test-proxy:8899
  PROXY_CHECK_URL: https://api.ipify.org?format=json
  LOG_LEVEL: info

x-restart: &restart
  restart: unless-stopped
  logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

services:
  postgres:
    <<: *restart
    image: postgres:16-alpine
    environment: { POSTGRES_USER: journey, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}", POSTGRES_DB: journey }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U journey"], interval: 3s, retries: 30 }

  redis:
    <<: *restart
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: [redisdata:/data]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 3s, retries: 30 }

  migrate:
    image: journey-node
    build: { context: .., dockerfile: infrastructure/docker/node.Dockerfile, args: { BUILD_WEB: "true", API_INTERNAL_URL: "http://api:4000" } }
    environment: *app-env
    working_dir: /app/packages/database
    command: ["npx", "prisma", "migrate", "deploy"]
    depends_on: { postgres: { condition: service_healthy } }

  api:
    <<: *restart
    image: journey-node
    environment:
      <<: *app-env
      API_HOST: 0.0.0.0
      API_PORT: 4000
      APP_ORIGIN: https://${APP_HOST}
      COOKIE_SECURE: "true"
      TRUST_PROXY: "true"
      ALLOW_REGISTRATION: first-user
    command: ["pnpm", "--filter", "@js/api", "start"]
    volumes: [artifacts:/data/artifacts]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  worker:
    <<: *restart
    build: { context: .., dockerfile: infrastructure/docker/worker.Dockerfile }
    environment: { <<: *app-env, WORKER_CONCURRENCY: "${WORKER_CONCURRENCY:-2}" }
    volumes: [artifacts:/data/artifacts]
    shm_size: 1gb
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  web:
    <<: *restart
    image: journey-node
    command: ["pnpm", "--filter", "@js/web", "start"]
    depends_on: [api]

  demo-site:
    <<: *restart
    image: journey-node
    environment: { DEMO_SITE_HOST: 0.0.0.0, DEMO_SITE_PORT: 4100 }
    command: ["pnpm", "--filter", "@js/demo-site", "start"]

  test-proxy:
    <<: *restart
    image: journey-node
    environment: { DEV_PROXY_PORT: 8899, DEV_PROXY_HOST: 0.0.0.0 }
    command: ["npx", "tsx", "tests/fixtures/dev-proxy.ts"]

  caddy:
    <<: *restart
    image: caddy:2.10.2-alpine
    ports: ["80:80", "443:443"]
    environment: { APP_HOST: "${APP_HOST}" }
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on: [web, demo-site]

volumes:
  pgdata:
  redisdata:
  artifacts:
  caddydata:
